[package]
name = "bungeeoxide-packet-dumper"
description = "Proxy between a Minecraft 1.21.11 client and server that reports packets which do not survive decoding and re-encoding"
version = "0.1.1"
edition = "2021"
license.workspace = true

[dependencies]
bungeeoxide-minecraft-v1-21-11.workspace = true
clap = { workspace = true, features = ["derive"] }
flate2.workspace = true
pds-bytes-runtime.workspace = true
