[package]
name = "bungeeoxide"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
futures = "0.3"
md-5 = "0.10"
minecraft-versions = { path = "../../crates/minecraft-versions" }
nbt = { path = "../../crates/nbt" }
pds-runtime = { path = "../../crates/pds-runtime" }
rand = "0.8"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3", default-features = false, features = ["rustls"] }
