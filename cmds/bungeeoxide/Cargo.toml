[package]
name = "bungeeoxide"
description = "Minecraft proxy that lets clients of versions 1.0.1 to 26.1 play on a server of another version"
version = "0.1.1"
edition = "2021"
license.workspace = true

[dependencies]
aes.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
flate2.workspace = true
futures.workspace = true
bungeeoxide-authlib.workspace = true
bungeeoxide-converter.workspace = true
bungeeoxide-nbt.workspace = true
pds-bytes-runtime.workspace = true
rand.workspace = true
rsa.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = { workspace = true, features = ["oid"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["codec"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
