[package]
name = "bungeeoxide-authlib"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
md-5 = "0.10"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
toml = "1.2"
tracing = "0.1.44"
ureq = { version = "3", default-features = false, features = ["rustls"] }
