[package]
name = "bungeeoxide-authlib"
description = "Minecraft account authentication: Microsoft and launcher logins, session server joins and checks, chat signing keys"
version = "0.1.1"
edition = "2021"
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
md-5.workspace = true
rsa.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1.workspace = true
sha2 = { workspace = true, features = ["oid"] }
toml.workspace = true
tracing.workspace = true
ureq = { workspace = true, features = ["rustls"] }
