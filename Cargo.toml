	"cmds/bungeeoxide-packet-dumper",
	"minecraft/*",
	"crates/bungeeoxide-pds-natives",
	"crates/bungeeoxide-authlib",
	"crates/bungeeoxide-converter",
	"crates/bungeeoxide-nbt",
	"crates/pds-bytes-runtime",
